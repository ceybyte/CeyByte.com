name: Deploy

# 02-TRD §17: push to `free`, content published from the admin (repository_dispatch), or manual.
on:
  push:
    branches: [free]
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://ceybyte.com' }}
    steps:
      - name: Skip until Cloudflare is configured
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.ready == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.ready == 'true'
      - run: bun run build
        if: steps.guard.outputs.ready == 'true'
      - run: bun run deploy
        if: steps.guard.outputs.ready == 'true'
      - name: Smoke test
        if: steps.guard.outputs.ready == 'true'
        run: |
          curl -fsS "$DEPLOY_URL/api/health"
          curl -fsS -o /dev/null "$DEPLOY_URL/"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://www.ceybyte.com/x/?y=1)" = "301 https://ceybyte.com/x/?y=1"
